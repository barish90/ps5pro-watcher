name: PS5 Pro stock watch

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub can delay scheduled runs a few minutes)
    - cron: "17 9 1 * *"     # monthly keep-alive so GitHub never pauses the schedule
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check only, send no email"
        type: boolean
        default: false
      test_email:
        description: "Just send a test email"
        type: boolean
        default: false

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.event.schedule == '17 9 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git commit --allow-empty -m "keep-alive" && git push

  watch:
    if: github.event.schedule != '17 9 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          sudo apt-get install -y xvfb >/dev/null
          which google-chrome || python -m playwright install --with-deps chromium

      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check stores
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ inputs.test_email }}" = "true" ]; then python watcher.py --test-email; exit $?; fi
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          xvfb-run -a python watcher.py $ARGS

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-log
          path: watcher.log
          retention-days: 3
